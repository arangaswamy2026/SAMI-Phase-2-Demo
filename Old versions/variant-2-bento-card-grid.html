<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Design reference: UUIF 9.2 — Bento Card Grid layout.
  Card mosaic with slide-over detail. Variant 2 of 5.
  Base file: sami-rec-scheduling-v1-uuif.html
  Gaps: "Policy Gap" category uses purple in original; no purple token in UUIF 9.2 —
        mapped to --uuif-surface-primary (#5b74a7) per base file convention.
        Slide-over is a custom SAMI pattern; not defined in UUIF 9.2.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMI Recommendation — Bento Card Grid (Variant 2 of 5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<style>
/* ─── UUIF 9.2 TOKEN DEFINITIONS ────────────────────────────────────────── */
:root {
  /* Text */
  --uuif-text-primary:    #191c25;
  --uuif-text-secondary:  #4a618f;
  --uuif-text-tertiary:   #888888;
  --uuif-text-contrast:   #ffffff;
  --uuif-text-disabled:   rgba(17,17,17,0.3);
  --uuif-text-hover:      #ff5d00;
  --uuif-text-highlight:  #0c2b67;

  /* Surface */
  --uuif-surface-container: #ffffff;
  --uuif-surface-bg:         #f4f6f9;
  --uuif-surface-primary:    #5b74a7;
  --uuif-surface-secondary:  #d2dff2;
  --uuif-surface-tertiary:   #f6f8fe;
  --uuif-surface-highlight:  #ff5d00;
  --uuif-surface-hover:      rgba(17,17,17,0.06);
  --uuif-surface-selected:   rgba(255,72,26,0.09);
  --uuif-surface-disabled:   #e8eff9;
  --uuif-surface-contrast:   #111315;
  --uuif-surface-model:      #f0f2f5;

  /* Border */
  --uuif-border-primary:     #ff5d00;
  --uuif-border-secondary:   #78a3e5;
  --uuif-border-tertiary:    #cccccc;
  --uuif-border-transparent: rgba(17,17,17,0.09);
  --uuif-border-disabled:    #d2dff2;
  --uuif-border-hover:       #ff5d00;

  /* Icon */
  --uuif-icon-primary:   #5885cc;
  --uuif-icon-secondary: #9dafd3;
  --uuif-icon-tertiary:  #62686d;
  --uuif-icon-hover:     #ff5d00;

  /* Branding */
  --uuif-brand-navy:   #001b50;
  --uuif-brand-blue:   #1f3c73;
  --uuif-brand-orange: #ff5d00;
  --uuif-brand-green:  #59a02e;
  --uuif-brand-red:    #c70f0f;
  --uuif-brand-yellow: #f3ac3d;

  /* Fill */
  --uuif-fill-blue-lightest:       #f6f8fe;
  --uuif-fill-green-xxx-lighter:   #e3efdc;
  --uuif-fill-yellow-xxx-lighter:  #ffe9be;
  --uuif-fill-red-lightest:        #fff0f0;
  --uuif-fill-green-x-darker:      #478234;
  --uuif-fill-orange-x-darker:     #c24903;
  --uuif-fill-red-x-darker:        #ab0a0c;

  /* Spacing */
  --uuif-sp-1:  2px;
  --uuif-sp-2:  4px;
  --uuif-sp-3:  8px;
  --uuif-sp-4:  12px;
  --uuif-sp-5:  16px;
  --uuif-sp-6:  20px;
  --uuif-sp-7:  24px;
  --uuif-sp-8:  32px;

  /* Radius */
  --uuif-radius-4:    4px;
  --uuif-radius-6:    6px;
  --uuif-radius-8:    8px;
  --uuif-radius-12:   12px;
  --uuif-radius-pill: 88px;

  /* Shadow */
  --uuif-shadow-sm: 0px 1px 6px 2px rgba(0,0,0,0.08);
  --uuif-shadow-md: 0px 4px 12px 0px rgba(0,0,0,0.16);

  /* Category colors (left-border accent) */
  --cat-cve:   #ff5d00;
  --cat-device:#c70f0f;
  --cat-behav: #5885cc;
  --cat-policy:#5b74a7;
  --cat-sub:   #59a02e;
}

/* ─── RESET + BASE ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--uuif-surface-bg);
  color: var(--uuif-text-primary);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

/* ─── PRIMARY NAV RAIL — 60px fixed sidebar ─────────────────────────────── */
.sidebar {
  position: fixed; left: 0; top: 0; width: 60px; height: 100vh;
  background: var(--uuif-brand-navy);
  display: flex; flex-direction: column; align-items: center;
  z-index: 300;
}
.sidebar-logo {
  width: 60px; height: 52px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-logo svg { width: 28px; height: 28px; }
.sidebar-icon {
  width: 60px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  color: var(--uuif-icon-secondary);
  cursor: pointer; position: relative; transition: color .15s;
  border-left: 2px solid transparent;
}
.sidebar-icon:hover { color: var(--uuif-icon-hover); }
.sidebar-icon.active {
  background: rgba(17,17,17,0.4);
  border-left-color: var(--uuif-brand-orange);
  color: var(--uuif-brand-orange);
}
.sidebar-icon .badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--uuif-brand-orange); color: var(--uuif-text-contrast);
  font-size: 9px; font-weight: 700;
  border-radius: var(--uuif-radius-pill);
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 var(--uuif-sp-2);
}
.sidebar-spacer { flex: 1; }

/* ─── TOP ACTION BAR — 46px ─────────────────────────────────────────────── */
.topbar {
  position: fixed; left: 60px; right: 0; top: 0; height: 46px;
  background: var(--uuif-surface-container);
  border-bottom: 1px solid var(--uuif-border-transparent);
  display: flex; align-items: center;
  padding: 0 var(--uuif-sp-5); z-index: 299; gap: var(--uuif-sp-3);
}
.breadcrumb {
  display: flex; align-items: center; gap: var(--uuif-sp-2);
  font-size: 12px; color: var(--uuif-text-secondary); flex: 1;
}
.breadcrumb a { color: var(--uuif-icon-primary); text-decoration: none; }
.breadcrumb a:hover { color: var(--uuif-text-hover); text-decoration: underline; }
.breadcrumb span { color: var(--uuif-text-tertiary); }
.tenant-selector {
  display: flex; align-items: center; gap: var(--uuif-sp-2);
  border: 1px solid var(--uuif-border-tertiary);
  border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-4);
  font-size: 12px; cursor: pointer; font-family: 'Nunito Sans', sans-serif;
  background: var(--uuif-surface-container); color: var(--uuif-text-primary);
  transition: border-color .15s;
}
.tenant-selector:hover { border-color: var(--uuif-border-secondary); }
.tenant-selector .dot { width: 8px; height: 8px; background: var(--uuif-brand-orange); border-radius: 50%; }
.topbar-icons { display: flex; align-items: center; gap: var(--uuif-sp-3); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--uuif-text-tertiary);
  transition: background .15s; position: relative;
}
.icon-btn:hover { background: var(--uuif-surface-hover); }
.notif-badge {
  position: absolute; top: 4px; right: 4px; width: 8px; height: 8px;
  background: var(--uuif-brand-orange); border-radius: 50%;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--uuif-brand-blue); color: var(--uuif-text-contrast);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ─── PAGE WRAPPER ──────────────────────────────────────────────────────── */
.page { margin-left: 60px; padding-top: 46px; min-height: 100vh; }
.page-content { padding: var(--uuif-sp-5) var(--uuif-sp-6) var(--uuif-sp-8); }

/* ─── PAGE HEADER ───────────────────────────────────────────────────────── */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: var(--uuif-sp-4);
}
.page-header-left { display: flex; align-items: flex-start; gap: var(--uuif-sp-3); }
.back-btn {
  width: 28px; height: 28px; border: none; background: transparent;
  cursor: pointer; color: var(--uuif-brand-orange);
  display: flex; align-items: center; justify-content: center;
  margin-top: 3px; border-radius: var(--uuif-radius-4); text-decoration: none;
  transition: background .15s;
}
.back-btn:hover { background: var(--uuif-surface-selected); }
.page-title { font-size: 20px; font-weight: 700; color: var(--uuif-text-primary); line-height: 1.2; }
.page-sub   { font-size: 12px; color: var(--uuif-text-tertiary); margin-top: var(--uuif-sp-1); }
/* uuif-btn Secondary */
.export-btn {
  background: var(--uuif-surface-container);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-5);
  font-size: 13px; cursor: pointer; font-family: 'Nunito Sans', sans-serif;
  color: var(--uuif-text-secondary); display: flex; align-items: center;
  gap: var(--uuif-sp-2); font-weight: 500; transition: all .15s;
  white-space: nowrap; align-self: flex-start; margin-top: 2px;
}
.export-btn:hover { border-color: var(--uuif-border-hover); color: var(--uuif-text-hover); }

/* ─── SUMMARY STRIP ─────────────────────────────────────────────────────── */
.summary-strip {
  display: flex; align-items: center; gap: var(--uuif-sp-4);
  margin-bottom: var(--uuif-sp-5);
}
/* uuif-chip variants inline */
.summary-chip {
  display: inline-flex; align-items: center; gap: var(--uuif-sp-2);
  font-size: 12px; font-weight: 600;
  border-radius: var(--uuif-radius-pill);
  padding: 4px var(--uuif-sp-4); border: 1px solid;
  height: 26px;
}
/* Success chip — deploying */
.chip-deploying {
  background: var(--uuif-fill-green-xxx-lighter);
  color: var(--uuif-brand-green);
  border-color: var(--uuif-brand-green);
}
/* Info chip — scheduled */
.chip-scheduled {
  background: var(--uuif-fill-blue-lightest);
  color: var(--uuif-surface-primary);
  border-color: var(--uuif-border-secondary);
}
/* Warning chip — needs action */
.chip-action {
  background: var(--uuif-fill-yellow-xxx-lighter);
  color: #c27900;
  border-color: var(--uuif-brand-yellow);
}
.chip-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.chip-dot.green  { background: var(--uuif-brand-green); }
.chip-dot.blue   { background: var(--uuif-surface-primary); }
.chip-dot.yellow { background: var(--uuif-brand-yellow); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.chip-dot.green { animation: pulse 1.6s infinite; }

/* ─── CARD GRID — 2-column bento ────────────────────────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--uuif-sp-5);
}

/* ─── RECOMMENDATION CARD ───────────────────────────────────────────────── */
.rec-card {
  background: var(--uuif-surface-container);
  border-radius: var(--uuif-radius-8);
  box-shadow: var(--uuif-shadow-sm);
  border: 1px solid var(--uuif-border-transparent);
  border-left: 3px solid var(--uuif-border-tertiary); /* overridden per category */
  display: flex; flex-direction: column;
  min-height: 280px;
  cursor: pointer; transition: box-shadow .18s, transform .12s;
  overflow: hidden;
  position: relative;
}
.rec-card:hover {
  box-shadow: var(--uuif-shadow-md);
  transform: translateY(-1px);
}
.rec-card:focus-visible { outline: 2px solid var(--uuif-border-secondary); outline-offset: 2px; }

/* Category left-border overrides */
.rec-card[data-cat="cve"]    { border-left-color: var(--cat-cve); }
.rec-card[data-cat="device"] { border-left-color: var(--cat-device); }
.rec-card[data-cat="behav"]  { border-left-color: var(--cat-behav); }
.rec-card[data-cat="policy"] { border-left-color: var(--cat-policy); }
.rec-card[data-cat="sub"]    { border-left-color: var(--cat-sub); }

/* ── Card header row ── */
.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: var(--uuif-sp-4) var(--uuif-sp-4) 0 var(--uuif-sp-4);
}
/* Category badge chip — uuif-chip label pattern */
.cat-chip {
  font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
  border-radius: var(--uuif-radius-4);
  padding: 3px var(--uuif-sp-3); border: 1px solid;
  display: inline-block;
}
/* Criticality indicator */
.crit-badge {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--uuif-brand-red); color: var(--uuif-text-contrast);
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-left: var(--uuif-sp-2);
}

/* ── Card body ── */
.card-body { padding: var(--uuif-sp-3) var(--uuif-sp-4) 0; flex: 1; display: flex; flex-direction: column; }
.card-title {
  font-size: 13px; font-weight: 700; color: var(--uuif-text-primary);
  line-height: 1.45; margin-bottom: var(--uuif-sp-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-metric {
  font-size: 12px; color: var(--uuif-text-secondary);
  margin-bottom: var(--uuif-sp-3);
  display: flex; align-items: center; gap: var(--uuif-sp-2);
}
.card-metric span { color: var(--uuif-text-tertiary); }

/* ── Status section ── */
.card-status { margin-bottom: var(--uuif-sp-3); }

/* Progress bar — in-progress */
.status-progress-wrap {
  display: flex; flex-direction: column; gap: var(--uuif-sp-1);
}
.status-progress-label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--uuif-brand-green); font-weight: 600;
}
.status-prog-bar {
  height: 6px; background: var(--uuif-border-disabled);
  border-radius: var(--uuif-radius-pill); overflow: hidden;
}
.status-prog-fill {
  height: 100%; background: var(--uuif-brand-green);
  border-radius: var(--uuif-radius-pill);
}

/* Scheduled date pill — uuif-chip Info */
.status-sched-pill {
  display: inline-flex; align-items: center; gap: var(--uuif-sp-2);
  background: var(--uuif-fill-blue-lightest);
  color: var(--uuif-surface-primary);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-pill);
  padding: 3px var(--uuif-sp-4);
  font-size: 11px; font-weight: 600;
}

/* Needs action warning chip — uuif-chip Warning */
.status-action-chip {
  display: inline-flex; align-items: center; gap: var(--uuif-sp-2);
  background: var(--uuif-fill-yellow-xxx-lighter);
  color: #c27900;
  border: 1px solid var(--uuif-brand-yellow);
  border-radius: var(--uuif-radius-4);
  padding: 3px var(--uuif-sp-3);
  font-size: 11px; font-weight: 600;
}

/* ── Card action bar ── */
.card-actions {
  border-top: 1px solid var(--uuif-border-transparent);
  padding: var(--uuif-sp-3) var(--uuif-sp-4);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--uuif-sp-2);
  margin-top: auto;
}
/* uuif-btn Secondary small */
.card-btn-sec {
  background: var(--uuif-surface-container);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-4);
  font-size: 12px; cursor: pointer; color: var(--uuif-text-secondary);
  font-weight: 500; font-family: 'Nunito Sans', sans-serif;
  transition: all .15s; white-space: nowrap;
}
.card-btn-sec:hover { border-color: var(--uuif-border-hover); color: var(--uuif-text-hover); }
/* uuif-btn Primary small */
.card-btn-pri {
  background: var(--uuif-surface-primary); color: var(--uuif-text-contrast);
  border: none; border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-4);
  font-size: 12px; cursor: pointer; font-weight: 600;
  font-family: 'Nunito Sans', sans-serif; transition: background .15s;
  white-space: nowrap;
}
.card-btn-pri:hover { background: var(--uuif-brand-navy); }

/* ─── SLIDE-OVER OVERLAY ────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.32);
  z-index: 400;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.overlay.open { opacity: 1; pointer-events: auto; }

/* ─── SLIDE-OVER PANEL — 400px from right ───────────────────────────────── */
.slideover {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 400px;
  background: var(--uuif-surface-container);
  z-index: 401;
  display: flex; flex-direction: column;
  box-shadow: -4px 0 24px rgba(0,0,0,0.18);
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.slideover.open { transform: translateX(0); }

/* Slide-over close bar */
.so-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--uuif-sp-5); height: 46px; flex-shrink: 0;
  border-bottom: 1px solid var(--uuif-border-transparent);
  background: var(--uuif-surface-container);
}
.so-close {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--uuif-text-tertiary);
  background: none; border: none; transition: background .15s;
}
.so-close:hover { background: var(--uuif-surface-hover); }
.so-breadcrumb { font-size: 12px; color: var(--uuif-text-secondary); }

/* Slide-over scroll body */
.so-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* Slide-over header */
.so-header {
  padding: var(--uuif-sp-5) var(--uuif-sp-6) var(--uuif-sp-4);
  border-bottom: 1px solid var(--uuif-border-transparent);
}
.so-badge { margin-bottom: var(--uuif-sp-3); }
.cve-tag {
  font-size: 11px; font-weight: 700;
  border-radius: var(--uuif-radius-4); padding: 3px var(--uuif-sp-3);
  border: 1px solid; display: inline-block; letter-spacing: 0.01em;
}
.so-title {
  font-size: 15px; font-weight: 700; color: var(--uuif-text-primary);
  line-height: 1.4; margin-bottom: var(--uuif-sp-3);
}
.so-scope {
  display: flex; gap: var(--uuif-sp-4); font-size: 12px;
  color: var(--uuif-text-secondary); align-items: center; flex-wrap: wrap;
}

/* SAMI info banner — Info Status Banner pattern */
.so-sami-note {
  margin: var(--uuif-sp-4) var(--uuif-sp-5) 0;
  background: var(--uuif-fill-blue-lightest);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-6);
  padding: var(--uuif-sp-3) var(--uuif-sp-4);
  font-size: 12px; color: var(--uuif-text-primary); line-height: 1.6;
  display: flex; align-items: flex-start; gap: var(--uuif-sp-3);
}
.ds-tag {
  background: var(--uuif-brand-orange); color: var(--uuif-text-contrast);
  font-size: 10px; font-weight: 700; border-radius: var(--uuif-radius-4);
  padding: 2px var(--uuif-sp-2); flex-shrink: 0; margin-top: 2px;
  letter-spacing: 0.03em;
}

/* Slide-over body */
.so-body { padding: var(--uuif-sp-5) var(--uuif-sp-5); flex: 1; }
.section-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--uuif-text-tertiary);
  margin-bottom: var(--uuif-sp-3);
}
.evidence-item {
  display: flex; align-items: center; gap: var(--uuif-sp-3);
  padding: var(--uuif-sp-2) 0; font-size: 12px; color: var(--uuif-text-primary);
  border-bottom: 1px solid var(--uuif-border-transparent);
}
.evidence-item:last-child { border-bottom: none; }
.ev-icon {
  width: 22px; height: 22px; border-radius: var(--uuif-radius-4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.ev-icon.shield  { background: var(--uuif-fill-blue-lightest); }
.ev-icon.chart   { background: var(--uuif-surface-model); }
.ev-icon.warning { background: var(--uuif-fill-yellow-xxx-lighter); }
.ev-icon.check   { background: var(--uuif-fill-green-xxx-lighter); }
.timeline-section { margin-top: var(--uuif-sp-5); }
.timeline-item {
  display: flex; gap: var(--uuif-sp-4); padding: var(--uuif-sp-2) 0;
  font-size: 12px; border-bottom: 1px solid var(--uuif-border-transparent);
  color: var(--uuif-text-primary);
}
.timeline-item:last-child { border-bottom: none; }
.timeline-date {
  color: var(--uuif-icon-primary); font-weight: 600;
  min-width: 110px; flex-shrink: 0;
}

/* ─── SLIDE-OVER FOOTER + INLINE SCHEDULER ──────────────────────────────── */
.so-footer-wrap {
  border-top: 1px solid var(--uuif-border-transparent);
  background: var(--uuif-surface-container);
  flex-shrink: 0;
}

/* Default footer */
.df-default {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--uuif-sp-3) var(--uuif-sp-5);
  gap: var(--uuif-sp-3);

/* ─── STATE ─────────────────────────────────────────────────────────────── */
let currentItem   = null;
let footerState   = 'default';
let selectedTime  = null;

/* ─── CARD RENDERING ────────────────────────────────────────────────────── */
function buildStatusSection(idx) {
  const is = ITEM_STATES[idx];
  if (is.state === 'inprogress') {
    return `
      <div class="status-progress-wrap">
        <div class="status-progress-label">
          <span><span class="inprog-spinner" style="color:var(--uuif-brand-green);vertical-align:middle;"></span>&nbsp;Deploying — ${is.progress}%</span>
          <span style="color:var(--uuif-text-tertiary);font-size:11px;">${is.deployed}/${is.total} devices</span>
        </div>
        <div class="status-prog-bar">
          <div class="status-prog-fill" style="width:${is.progress}%"></div>
        </div>
      </div>`;
  }
  if (is.state === 'scheduled') {
    return `
      <span class="status-sched-pill">
        ${ICON_CAL} ${is.when}
      </span>`;
  }
  // needs action
  return `<span class="status-action-chip">⚠ Needs action</span>`;
}

function buildCard(idx) {
  const item = ITEMS[idx];
  const cs   = CAT_STYLES[item.cat];
  const is   = ITEM_STATES[idx];

  // Determine secondary button label
  const schedLabel = (is.state === 'inprogress') ? 'Adjust schedule' :
                     (is.state === 'scheduled')   ? 'Reschedule'      :
                                                     'Schedule for later';

  // Primary button label
  const priLabel = item.primaryLabel;

  return `
    <div class="rec-card" data-cat="${item.cat}" data-idx="${idx}"
         tabindex="0" role="button"
         aria-label="${item.catLabel}: ${item.title}"
         onclick="openCard(${idx})"
         onkeydown="if(event.key==='Enter'||event.key===' ')openCard(${idx})">
      <!-- Card header: category badge + criticality indicator -->
      <div class="card-head">
        <span class="cat-chip"
          style="color:${cs.color};background:${cs.bg};border-color:${cs.border};">
          ${item.catLabel}
        </span>
        <div class="crit-badge" title="Critical severity">!</div>
      </div>

      <!-- Card body: title + metric row -->
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-metric">
          ${item.metricIcon}
          <span style="color:var(--uuif-text-secondary)">${item.metric}</span>
        </div>

        <!-- Status section -->
        <div class="card-status">
          ${buildStatusSection(idx)}
        </div>
      </div>

      <!-- Card action bar -->
      <div class="card-actions">
        <button class="card-btn-sec"
          onclick="event.stopPropagation(); openCardScheduler(${idx})">
          ${ICON_CAL} ${schedLabel}
        </button>
        <button class="card-btn-pri"
          onclick="event.stopPropagation(); handleCardPrimaryAction(${idx})">
          ${(is.state === 'inprogress') ? 'View progress' :
            (is.state === 'scheduled')  ? 'Details' : 'Take action'}
        </button>
      </div>
    </div>`;
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = ITEMS.map((_, i) => buildCard(i)).join('');
}

/* ─── SLIDE-OVER OPEN / CLOSE ───────────────────────────────────────────── */
function openCard(idx) {
  currentItem = idx;
  const is = ITEM_STATES[idx];
  footerState = is.state === 'inprogress' ? 'inprogress' :
                is.state === 'scheduled'  ? 'scheduled'  : 'default';
  selectedTime = is.state === 'scheduled' ? is.when : null;

  renderSlideOver(idx);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('slideover').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSlideOver() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('slideover').classList.remove('open');
  document.body.style.overflow = '';
  currentItem = null;
}

/* ─── SLIDE-OVER RENDERING ──────────────────────────────────────────────── */
function renderSlideOver(idx) {
  const d  = ITEMS[idx];
  const is = ITEM_STATES[idx];

  const scopeHTML = d.scope.map(s =>
    `<span style="display:flex;align-items:center;gap:4px;">${s.icon} ${s.text}</span>`
  ).join('');

  const evidenceHTML = d.evidence.map(e =>
    `<div class="evidence-item"><div class="ev-icon ${e.cls}">${e.icon}</div>${e.text}</div>`
  ).join('');

  const timelineHTML = d.timeline.map(t =>
    `<div class="timeline-item"><div class="timeline-date">${t.date}</div><div>${t.desc}</div></div>`
  ).join('');

  document.getElementById('soScroll').innerHTML = `
    <div class="so-header">
      <div class="so-badge">
        <span class="cve-tag"
          style="color:${d.tagColor};background:${d.tagBg};border-color:${d.tagBorder};">
          ${d.tag}
        </span>
      </div>
      <div class="so-title">${d.soTitle}</div>
      <div class="so-scope">${scopeHTML}</div>
    </div>

    <div class="so-sami-note">
      <span class="ds-tag">SAMI</span>
      <span>${d.samiNote}</span>
    </div>

    <div class="so-body">
      <div class="section-title">Evidence</div>
      ${evidenceHTML}

      <div class="timeline-section">
        <div class="section-title" style="margin-top:16px;">Timeline</div>
        ${timelineHTML}
      </div>
    </div>`;

  renderFooter(idx);
}

/* ─── FOOTER RENDERING ──────────────────────────────────────────────────── */
function renderFooter(idx) {
  const d  = ITEMS[idx];
  const is = ITEM_STATES[idx];
  const fw = document.getElementById('soFooterWrap');
  if (!fw) return;

  if (footerState === 'inprogress') {
    fw.innerHTML = `
      <div class="df-inprogress">
        <div class="df-ip-top">
          <div class="df-ip-label">
            <span class="inprog-spinner"></span> Deployment in progress
          </div>
          <span class="df-ip-eta">${is.eta}</span>
        </div>
        <div class="df-prog-bar">
          <div class="df-prog-fill" style="width:${is.progress}%"></div>
        </div>
        <div class="df-ip-bottom">
          <span class="df-ip-status">${is.deployed} of ${is.total} devices patched · Running ${is.since}</span>
          <div class="df-ip-links">
            <button class="btn-view" onclick="showToast('Opening live deployment view…')">View live progress</button>
            <button class="btn-pause" onclick="showToast('Deployment pause requested. Crown Logistics batch will complete first.')">Pause queue</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if (footerState === 'scheduled') {
    const when  = selectedTime || (is.state === 'scheduled' ? is.when : '—');
    const notes = (is.state === 'scheduled') ? is.notes : 'Scheduled via SAMI';
    fw.innerHTML = `
      <div class="df-scheduled">
        <div class="df-sched-info">
          <span class="sched-icon">📅</span>
          <div>
            <div class="sched-text">Scheduled for ${when}</div>
            <div class="sched-sub">${notes} · SAMI will execute automatically</div>
          </div>
        </div>
        <div class="df-sched-links">
          <button class="btn-edit" onclick="openScheduler(${idx})">Edit</button>
          <button class="btn-cancel" onclick="cancelItemSchedule(${idx})">Cancel</button>
          <button class="btn-dnow" onclick="deployNow(${idx})">Deploy now instead</button>
        </div>
      </div>`;
    return;
  }

  if (footerState === 'scheduling') {
    fw.innerHTML = `
      <div class="df-scheduling">
        <div class="sched-expand-header">
          <span class="seh-icon">📅</span> Schedule for later
        </div>
        <div class="sched-time-row">
          ${['Tonight, 11:00 PM','Tomorrow, 2:00 AM','Monday, 2:00 AM','Custom'].map(t =>
            `<button class="sched-time-btn ${selectedTime===t?'selected':''}"
               onclick="selectScheduleTime('${t}',${idx})">${t}</button>`
          ).join('')}
        </div>
        <div class="sched-sami-block" id="samiReasonBlock">
          <span class="ssb-tag">SAMI</span>
          ${selectedTime && SAMI_SCHED_REASONING[selectedTime]
            ? `<span>${SAMI_SCHED_REASONING[selectedTime]}</span>`
            : `<span class="sched-placeholder">Select a time above — SAMI will show scheduling context and conflict analysis.</span>`
          }
        </div>
        <div class="sched-actions-row">
          <button class="btn-sched-cancel" onclick="cancelSchedulerOpen(${idx})">Cancel</button>
          <button class="btn-sched-confirm"
            onclick="confirmSchedule(${idx})"
            ${!selectedTime || selectedTime==='Custom' ? 'disabled' : ''}>
            Confirm schedule
          </button>
        </div>
      </div>`;
    return;
  }

  // default footer
  fw.innerHTML = `
    <div class="df-default">
      <span class="df-view-link" onclick="showToast('Opening device list…')">${d.viewLink}</span>
      <div class="footer-actions">
        <button class="btn-sched" onclick="openScheduler(${idx})">
          ${ICON_CAL} ${d.schedLabel}
        </button>
        <button class="btn-primary" onclick="handlePrimaryAction(${idx})">${d.primaryLabel}</button>
      </div>
    </div>`;
}

/* ─── SCHEDULER INTERACTIONS ────────────────────────────────────────────── */
function openScheduler(idx) {
  footerState  = 'scheduling';
  selectedTime = null;
  renderFooter(idx);
}
function openCardScheduler(idx) {
  openCard(idx);
  // allow slide-over to render then open scheduler
  setTimeout(() => { footerState = 'scheduling'; selectedTime = null; renderFooter(idx); }, 60);
}
function handleCardPrimaryAction(idx) {
  openCard(idx);
}
function handlePrimaryAction(idx) {
  showToast('Initiating action…');
}
function cancelSchedulerOpen(idx) {
  const is = ITEM_STATES[idx];
  footerState  = is.state === 'inprogress' ? 'inprogress' :
                 is.state === 'scheduled'  ? 'scheduled'  : 'default';
  selectedTime = is.state === 'scheduled' ? is.when : null;
  renderFooter(idx);
}
function selectScheduleTime(t, idx) {
  selectedTime = t;
  renderFooter(idx);
}
function confirmSchedule(idx) {
  if (!selectedTime || selectedTime === 'Custom') return;
  ITEM_STATES[idx] = {
    state: 'scheduled',
    when: selectedTime,
    whenShort: selectedTime,
    notes: 'Scheduled via SAMI'
  };
  footerState = 'scheduled';
  renderFooter(idx);
  showToast(`Scheduled for ${selectedTime}`);
  // Update card in the grid
  const cardEl = document.querySelector(`.rec-card[data-idx="${idx}"]`);
  if (cardEl) {
    cardEl.outerHTML = buildCard(idx);
    // Re-bind since outerHTML swap removes the element — re-render all cards
    renderCards();
  }
}
function cancelItemSchedule(idx) {
  ITEM_STATES[idx] = { state: 'active' };
  footerState  = 'default';
  selectedTime = null;
  renderFooter(idx);
  showToast('Schedule cancelled — item returned to active queue');
  renderCards();
}
function deployNow(idx) {
  ITEM_STATES[idx] = { state: 'active' };
  footerState  = 'default';
  selectedTime = null;
  renderFooter(idx);
  showToast('Deploying now — SAMI is initiating the action');
  renderCards();
}

/* ─── TOAST ─────────────────────────────────────────────────────────────── */
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ─── KEYBOARD CLOSE ────────────────────────────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSlideOver();
});

/* ─── INIT ──────────────────────────────────────────────────────────────── */
renderCards();
</script>
