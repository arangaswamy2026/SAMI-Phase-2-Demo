<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Design reference: UUIF 9.2 — Timeline Scheduler. Gantt timeline + list + detail. Variant 4 of 5.
  Informed by: sami-rec-scheduling-v1-uuif.html (tokens, sidebar, topbar, footer states, scheduler UX)
  Gap noted: Gantt-style timeline panel is a custom SAMI pattern not defined in UUIF 9.2.
             Timeline blocks/markers extrapolated from UUIF 9.2 fill/border tokens.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMI Recommendations — Timeline Scheduler (UUIF 9.2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<style>

/* ─── TOKEN DEFINITIONS ─────────────────────────────────────────────────── */
:root {
  /* Text */
  --uuif-text-primary:   #191c25;
  --uuif-text-secondary: #4a618f;
  --uuif-text-tertiary:  #888888;
  --uuif-text-contrast:  #ffffff;
  --uuif-text-disabled:  rgba(17,17,17,0.3);
  --uuif-text-hover:     #ff5d00;
  --uuif-text-highlight: #0c2b67;

  /* Surface */
  --uuif-surface-container: #ffffff;
  --uuif-surface-bg:        #f4f6f9;
  --uuif-surface-primary:   #5b74a7;
  --uuif-surface-secondary: #d2dff2;
  --uuif-surface-tertiary:  #f6f8fe;
  --uuif-surface-hover:     rgba(17,17,17,0.06);
  --uuif-surface-selected:  rgba(255,72,26,0.09);
  --uuif-surface-disabled:  #e8eff9;
  --uuif-surface-model:     #f0f2f5;
  --uuif-surface-contrast:  #111315;

  /* Border */
  --uuif-border-primary:     #ff5d00;
  --uuif-border-secondary:   #78a3e5;
  --uuif-border-tertiary:    #cccccc;
  --uuif-border-transparent: rgba(17,17,17,0.09);
  --uuif-border-disabled:    #d2dff2;
  --uuif-border-hover:       #ff5d00;

  /* Icon */
  --uuif-icon-primary:   #5885cc;
  --uuif-icon-secondary: #9dafd3;
  --uuif-icon-tertiary:  #62686d;
  --uuif-icon-hover:     #ff5d00;

  /* Brand */
  --uuif-brand-navy:   #001b50;
  --uuif-brand-blue:   #1f3c73;
  --uuif-brand-orange: #ff5d00;
  --uuif-brand-green:  #59a02e;
  --uuif-brand-red:    #c70f0f;
  --uuif-brand-yellow: #f3ac3d;

  /* Fill */
  --uuif-fill-blue-lightest:      #f6f8fe;
  --uuif-fill-green-xxx-lighter:  #e3efdc;
  --uuif-fill-yellow-xxx-lighter: #ffe9be;
  --uuif-fill-red-lightest:       #fff0f0;
  --uuif-fill-orange-x-lighter:   #fff0e8;

  /* Spacing */
  --uuif-sp-1: 2px;  --uuif-sp-2: 4px;  --uuif-sp-3: 8px;
  --uuif-sp-4: 12px; --uuif-sp-5: 16px; --uuif-sp-6: 20px;
  --uuif-sp-7: 24px; --uuif-sp-8: 32px;

  /* Radius */
  --uuif-radius-4:    4px;
  --uuif-radius-6:    6px;
  --uuif-radius-8:    8px;
  --uuif-radius-12:   12px;
  --uuif-radius-pill: 88px;

  /* Shadow */
  --uuif-shadow-sm: 0px 1px 6px 2px rgba(0,0,0,0.12);
  --uuif-shadow-md: 0px 4px 12px 0px rgba(0,0,0,0.16);
}

/* ─── RESET + BASE ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--uuif-surface-bg);
  color: var(--uuif-text-primary);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

/* ─── SIDEBAR ───────────────────────────────────────────────────────────── */
.sidebar {
  position: fixed; left: 0; top: 0; width: 60px; height: 100vh;
  background: var(--uuif-brand-navy);
  display: flex; flex-direction: column; align-items: center;
  z-index: 200;
}
.sidebar-logo {
  width: 60px; height: 52px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-logo svg { width: 28px; height: 28px; }
.sidebar-icon {
  width: 60px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  color: var(--uuif-icon-secondary);
  cursor: pointer; position: relative; transition: color .15s;
  border-left: 2px solid transparent;
}
.sidebar-icon:hover { color: var(--uuif-icon-hover); }
.sidebar-icon.active {
  background: rgba(17,17,17,0.4);
  border-left-color: var(--uuif-brand-orange);
  color: var(--uuif-brand-orange);
}
.sidebar-icon .badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--uuif-brand-orange); color: #fff;
  font-size: 9px; font-weight: 700;
  border-radius: var(--uuif-radius-pill);
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 var(--uuif-sp-2);
}
.sidebar-spacer { flex: 1; }
.sidebar-icon svg { flex-shrink: 0; }

/* ─── TOPBAR ────────────────────────────────────────────────────────────── */
.topbar {
  position: fixed; left: 60px; right: 0; top: 0; height: 46px;
  background: var(--uuif-surface-container);
  border-bottom: 1px solid var(--uuif-border-transparent);
  display: flex; align-items: center;
  padding: 0 var(--uuif-sp-5); z-index: 199; gap: var(--uuif-sp-3);
}
.breadcrumb {
  display: flex; align-items: center; gap: var(--uuif-sp-2);
  font-size: 12px; color: var(--uuif-text-secondary); flex: 1;
}
.breadcrumb a { color: var(--uuif-icon-primary); text-decoration: none; }
.breadcrumb a:hover { color: var(--uuif-text-hover); }
.breadcrumb span { color: var(--uuif-text-tertiary); }
.tenant-selector {
  display: flex; align-items: center; gap: var(--uuif-sp-2);
  border: 1px solid var(--uuif-border-tertiary);
  border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-4);
  font-size: 12px; cursor: pointer;
  font-family: 'Nunito Sans', sans-serif;
  background: var(--uuif-surface-container);
  color: var(--uuif-text-primary); transition: border-color .15s;
}
.tenant-selector:hover { border-color: var(--uuif-border-secondary); }
.tenant-selector .dot { width: 8px; height: 8px; background: var(--uuif-brand-orange); border-radius: 50%; }
.topbar-icons { display: flex; align-items: center; gap: var(--uuif-sp-3); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--uuif-text-tertiary);
  transition: background .15s; position: relative;
}
.icon-btn:hover { background: var(--uuif-surface-hover); }
.notif-badge {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; background: var(--uuif-brand-orange); border-radius: 50%;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--uuif-brand-blue); color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ─── PAGE LAYOUT ───────────────────────────────────────────────────────── */
.page { margin-left: 60px; padding-top: 46px; min-height: 100vh; display: flex; flex-direction: column; }
.page-content { padding: var(--uuif-sp-4) var(--uuif-sp-5) var(--uuif-sp-3); display: flex; flex-direction: column; flex: 1; }

/* ─── PAGE HEADER ───────────────────────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 48px; flex-shrink: 0;
}
.page-header-left { display: flex; align-items: center; gap: var(--uuif-sp-3); }
.back-btn {
  width: 28px; height: 28px; border: none; background: transparent;
  cursor: pointer; color: var(--uuif-brand-orange);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--uuif-radius-4); transition: background .15s;
}
.back-btn:hover { background: var(--uuif-surface-selected); }
.page-title { font-size: 18px; font-weight: 700; color: var(--uuif-text-primary); }
.page-sub { font-size: 12px; color: var(--uuif-text-tertiary); margin-left: var(--uuif-sp-3); }
.page-header-right { display: flex; align-items: center; gap: var(--uuif-sp-3); }
.btn-export {
  background: var(--uuif-surface-container);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-pill);
  padding: var(--uuif-sp-2) var(--uuif-sp-5);
  font-size: 13px; cursor: pointer; color: var(--uuif-text-secondary);
  font-weight: 500; display: flex; align-items: center; gap: var(--uuif-sp-2);
  font-family: 'Nunito Sans', sans-serif; transition: all .15s; white-space: nowrap;
}
.btn-export:hover { border-color: var(--uuif-border-hover); color: var(--uuif-text-hover); }

/* ─── TIMELINE PANEL ────────────────────────────────────────────────────── */
.timeline-panel {
  background: var(--uuif-surface-container);
  border: 1px solid var(--uuif-border-transparent);
  border-radius: var(--uuif-radius-8);
  box-shadow: var(--uuif-shadow-sm);
  margin-bottom: var(--uuif-sp-3);
  flex-shrink: 0;
  overflow: hidden;
}
.timeline-panel-header {
  display: flex; align-items: center;
  padding: var(--uuif-sp-3) var(--uuif-sp-5);
  border-bottom: 1px solid var(--uuif-border-transparent);
  gap: var(--uuif-sp-4);
}
.tph-title { font-size: 13px; font-weight: 700; color: var(--uuif-text-highlight); }
.tph-counts { display: flex; align-items: center; gap: var(--uuif-sp-4); font-size: 12px; }
.tph-count { display: flex; align-items: center; gap: var(--uuif-sp-2); }
.tph-dot { width: 7px; height: 7px; border-radius: 50%; }
.tph-dot.green  { background: var(--uuif-brand-green); }
.tph-dot.blue   { background: var(--uuif-surface-primary); }
.tph-dot.orange { background: var(--uuif-brand-orange); }
.tph-sep { color: var(--uuif-border-tertiary); }
.timeline-ruler {
  display: flex; position: relative; height: 22px;
  border-bottom: 1px solid var(--uuif-border-transparent);
  background: var(--uuif-surface-bg);
}
.tl-day-col {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--uuif-text-tertiary);
  border-right: 1px solid var(--uuif-border-transparent);
  text-transform: uppercase; letter-spacing: 0.04em;
  position: relative;
}
.tl-day-col:last-child { border-right: none; }
.tl-day-col.today-col {
  color: var(--uuif-brand-orange);
  font-weight: 800;
  background: var(--uuif-fill-orange-x-lighter);
}
.tl-day-col .today-tag {
  background: var(--uuif-brand-orange); color: #fff;
  font-size: 8px; font-weight: 800;
  border-radius: var(--uuif-radius-4); padding: 1px 4px;
  margin-left: 3px; letter-spacing: 0.04em;
}
.timeline-bars-area {
  position: relative; height: 78px; padding: 6px 0 4px;
  overflow: hidden;
}
/* Vertical grid lines behind bars */
.timeline-bars-area .tl-grid {
  position: absolute; top: 0; bottom: 0; pointer-events: none;
  display: flex; width: 100%;
}
.tl-grid-col {
  flex: 1;
  border-right: 1px dashed rgba(17,17,17,0.06);
}
.tl-grid-col:last-child { border-right: none; }

/* TODAY vertical line */
.today-line {
  position: absolute; top: 0; bottom: 0;
  border-left: 2px dashed var(--uuif-brand-orange);
  z-index: 5; pointer-events: none;
}
.today-line-label {
  position: absolute; top: 2px; left: 3px;
  font-size: 9px; font-weight: 800;
  color: var(--uuif-brand-orange); letter-spacing: 0.05em;
}

/* Bar rows */
.tl-bar-row {
  position: absolute; left: 0; right: 0;
  height: 22px;
}
.tl-bar-row:nth-child(2) { top: 6px; }
.tl-bar-row:nth-child(3) { top: 32px; }
.tl-bar-row:nth-child(4) { top: 58px; /* overflow hidden */ }

/* Bar block */
.tl-bar {
  position: absolute;
  height: 22px; border-radius: var(--uuif-radius-4);
  display: flex; align-items: center; padding: 0 8px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  cursor: pointer; overflow: hidden;
  transition: box-shadow .15s, filter .15s;
  user-select: none;
}
.tl-bar:hover { filter: brightness(0.94); box-shadow: var(--uuif-shadow-sm); }
.tl-bar.selected { outline: 2px solid var(--uuif-brand-orange); outline-offset: 1px; }

/* In-progress bar (green) */
.tl-bar.inprogress {
  background: var(--uuif-brand-green);
  color: #fff;
}
.tl-bar.inprogress .tl-bar-prog {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(255,255,255,0.22);
  border-radius: var(--uuif-radius-4);
}
@keyframes bar-pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.6; }
}
.tl-bar.inprogress { animation: bar-pulse 2.4s ease-in-out infinite; }

/* Scheduled bar (blue) */
.tl-bar.scheduled {
  background: var(--uuif-surface-secondary);
  color: var(--uuif-surface-primary);
  border: 1px solid var(--uuif-border-secondary);
}

/* Needs-action diamond marker */
.tl-diamond-wrap {
  position: absolute; height: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.tl-diamond {
  width: 14px; height: 14px;
  background: var(--uuif-brand-orange);
  transform: rotate(45deg);
  border-radius: 2px;
  flex-shrink: 0;
}
.tl-diamond-label {
  font-size: 10px; font-weight: 600; color: var(--uuif-brand-orange);
  white-space: nowrap; margin-left: 8px;
}
.tl-diamond-wrap.selected .tl-diamond {
  outline: 2px solid var(--uuif-brand-orange); outline-offset: 2px;
}

/* Tooltip */
.tl-tooltip {
  position: fixed; z-index: 300;
  background: var(--uuif-surface-contrast);
  color: var(--uuif-text-contrast);
  font-size: 11px; font-weight: 600;
  border-radius: var(--uuif-radius-6);
  padding: var(--uuif-sp-2) var(--uuif-sp-4);
  pointer-events: none;
  opacity: 0; transition: opacity .1s;
  white-space: nowrap;
  box-shadow: var(--uuif-shadow-md);
}
.tl-tooltip.visible { opacity: 1; }

/* ─── TWO-COLUMN AREA ───────────────────────────────────────────────────── */
.two-col {
  display: flex; gap: 0; flex: 1;
  min-height: 0; border-radius: var(--uuif-radius-8);
  box-shadow: var(--uuif-shadow-sm);
  border: 1px solid var(--uuif-border-transparent);
  overflow: hidden;
}

/* ─── PRIORITY LIST (left) ──────────────────────────────────────────────── */
.list-col {
  width: 360px; flex-shrink: 0;
  background: var(--uuif-surface-container);
  border-right: 1px solid var(--uuif-border-transparent);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.list-col-header {
  padding: var(--uuif-sp-3) var(--uuif-sp-5);
  border-bottom: 1px solid var(--uuif-border-transparent);
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--uuif-text-highlight);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.list-col-header-right { display: flex; align-items: center; gap: var(--uuif-sp-2); }
.list-sort-btn {
  font-size: 11px; font-weight: 500; color: var(--uuif-icon-primary);
  background: none; border: 1px solid var(--uuif-border-disabled);
  border-radius: var(--uuif-radius-pill); padding: 2px 8px;
  cursor: pointer; font-family: 'Nunito Sans', sans-serif;
  transition: border-color .15s;
}
.list-sort-btn:hover { border-color: var(--uuif-border-secondary); }
.list-items-scroll { flex: 1; overflow-y: auto; }

/* List item card */
.list-item {
  padding: var(--uuif-sp-3) var(--uuif-sp-5);
  border-bottom: 1px solid var(--uuif-border-transparent);
  cursor: pointer; transition: background .12s;
  border-left: 3px solid transparent;
  display: flex; flex-direction: column; gap: var(--uuif-sp-2);
}
.list-item:hover { background: var(--uuif-surface-hover); }
.list-item.selected {
  background: var(--uuif-surface-selected);
  border-left-color: var(--uuif-brand-orange);
}
.li-row1 { display: flex; align-items: center; justify-content: space-between; }
.li-cat {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; display: flex; align-items: center; gap: 5px;
}
.li-cat-dot { width: 6px; height: 6px; border-radius: 50%; }
.li-cat.cve    .li-cat-dot { background: var(--uuif-brand-red); }
.li-cat.device .li-cat-dot { background: var(--uuif-brand-orange); }
.li-cat.behavioral .li-cat-dot { background: var(--uuif-icon-primary); }
.li-cat.policy .li-cat-dot { background: var(--uuif-surface-primary); }
.li-cat.subscription .li-cat-dot { background: var(--uuif-brand-yellow); }
.li-cat.cve    { color: var(--uuif-brand-red); }
.li-cat.device { color: var(--uuif-brand-orange); }
.li-cat.behavioral { color: var(--uuif-icon-primary); }
.li-cat.policy { color: var(--uuif-surface-primary); }
.li-cat.subscription { color: var(--uuif-brand-yellow); }
.li-status-chip {
  font-size: 10px; font-weight: 700;
  border-radius: var(--uuif-radius-4); padding: 2px 7px;
  border: 1px solid; height: 20px; display: inline-flex; align-items: center; gap: 5px;
}
.li-status-chip.inprogress {
  background: var(--uuif-fill-green-xxx-lighter);
  color: var(--uuif-brand-green); border-color: var(--uuif-brand-green);
}
.li-status-chip.scheduled {
  background: var(--uuif-fill-blue-lightest);
  color: var(--uuif-surface-primary); border-color: var(--uuif-border-secondary);
}
.li-status-chip.needs-action {
  background: var(--uuif-fill-yellow-xxx-lighter);
  color: var(--uuif-brand-yellow); border-color: var(--uuif-brand-yellow);
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-mini {
  width: 8px; height: 8px;
  border: 1.5px solid var(--uuif-brand-green); border-top-color: transparent;
  border-radius: 50%; animation: spin .8s linear infinite; display: inline-block;
}
.li-title {
  font-size: 13px; font-weight: 700; color: var(--uuif-text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.li-row3 { display: flex; align-items: center; justify-content: space-between; }
.li-tenants { font-size: 11px; color: var(--uuif-text-secondary); }
.li-updated { font-size: 11px; color: var(--uuif-text-tertiary); }
.li-progress-mini {
  height: 3px; background: var(--uuif-border-disabled);
  border-radius: var(--uuif-radius-pill); overflow: hidden; margin-top: 2px;
}
.li-progress-fill {
  height: 100%; background: var(--uuif-brand-green);
  border-radius: var(--uuif-radius-pill);
}

/* ─── DETAIL PANEL (right) ──────────────────────────────────────────────── */
.detail-col {
  flex: 1; background: var(--uuif-surface-container);
  display: flex; flex-direction: column; overflow: hidden;
}
.detail-scroll { flex: 1; overflow-y: auto; }
.detail-header {
  padding: var(--uuif-sp-5) var(--uuif-sp-6) var(--uuif-sp-4);
  border-bottom: 1px solid var(--uuif-border-transparent);
}
.detail-badge-row { display: flex; align-items: center; gap: var(--uuif-sp-3); margin-bottom: var(--uuif-sp-3); }
.d-cat-tag {
  font-size: 11px; font-weight: 700;
  border-radius: var(--uuif-radius-4); padding: 3px 8px;
  border: 1px solid;
}
.d-cat-tag.cve    { background: var(--uuif-fill-red-lightest); color: var(--uuif-brand-red); border-color: var(--uuif-brand-red); }
.d-cat-tag.device { background: var(--uuif-fill-orange-x-lighter); color: var(--uuif-brand-orange); border-color: var(--uuif-brand-orange); }
.d-cat-tag.behavioral { background: var(--uuif-fill-blue-lightest); color: var(--uuif-icon-primary); border-color: var(--uuif-border-secondary); }
.d-cat-tag.policy { background: var(--uuif-fill-blue-lightest); color: var(--uuif-surface-primary); border-color: var(--uuif-border-secondary); }
.d-cat-tag.subscription { background: var(--uuif-fill-yellow-xxx-lighter); color: var(--uuif-brand-yellow); border-color: var(--uuif-brand-yellow); }
.detail-title { font-size: 16px; font-weight: 700; color: var(--uuif-text-primary); line-height: 1.35; margin-bottom: var(--uuif-sp-3); }
.detail-scope {
  display: flex; gap: var(--uuif-sp-4); font-size: 12px;
  color: var(--uuif-text-secondary); align-items: center; flex-wrap: wrap;
}
.detail-scope-item { display: flex; align-items: center; gap: var(--uuif-sp-2); }

/* SAMI note banner */
.sami-note {
  margin: var(--uuif-sp-4) var(--uuif-sp-6) 0;
  background: var(--uuif-fill-blue-lightest);
  border: 1px solid var(--uuif-border-secondary);
  border-radius: var(--uuif-radius-6);
  padding: var(--uuif-sp-3) var(--uuif-sp-4);
  font-size: 13px; color: var(--uuif-text-primary);
  line-height: 1.6; display: flex; align-items: flex-start; gap: var(--uuif-sp-3);
}
.sami-note .sn-tag {
  background: var(--uuif-brand-orange); color: #fff;
  font-size: 10px; font-weight: 700; border-radius: var(--uuif-radius-4);
  padding: 2px 5px; flex-shrink: 0; margin-top: 2px;
}

/* SAMI scheduling reasoning */
const SAMI_REASONS = {
  'Tonight 11pm': 'Tonight at 11:00 PM falls within Acme Corp\'s maintenance window (10 PM–2 AM). SAMI will sequence tenant deployments — estimated total window: 38 minutes.',
  'Tomorrow 2am': 'Tomorrow 2:00 AM works for Westfield IT and Beta Networks. Crown Logistics has no approved Friday window — their 2 devices require separate confirmation.',
  'Monday 2am': 'Monday 2:00 AM is optimal — all 4 tenant maintenance windows align. No concurrent SAMI operations queued.',
  'Custom': 'SAMI will validate against all 4 tenant maintenance windows and flag any conflicts before confirming.'
};

/* Per-item primary action labels */
const PRIMARY_LABELS = {
  'inprogress': null,
  'scheduled': 'Deploy Now',
  'needs-action': 'Review & Approve'
};

/* ═══════════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════════ */
let selectedId  = 0;
let footerState = {}; // itemId -> 'default' | 'scheduling' | 'scheduled' | 'inprogress'
let schedTimes  = {}; // itemId -> selected time label
let itemStatuses = {}; // itemId -> runtime status (can change after scheduling)

ITEMS.forEach(it => {
  itemStatuses[it.id] = it.status;
  footerState[it.id]  = it.status === 'inprogress' ? 'inprogress'
                       : it.status === 'scheduled'  ? 'scheduled'
                       : 'default';
  schedTimes[it.id]   = it.schedTime || null;
});

/* ═══════════════════════════════════════════════════════════════════════
   TIMELINE RENDERING
═══════════════════════════════════════════════════════════════════════ */
function renderTimeline() {
  const barsArea = document.getElementById('tlBarsArea');
  const grid     = document.getElementById('tlGrid');

  /* Grid columns */
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('div');
    d.className = 'tl-grid-col';
    grid.appendChild(d);
  }

  /* Today line at NOW */
  const todayLine = document.getElementById('todayLine');
  todayLine.style.left = pct(NOW_HOUR) + '%';

  /* Remove old bars */
  const oldBars = barsArea.querySelectorAll('.tl-bar, .tl-diamond-wrap, .tl-bar-row');
  oldBars.forEach(b => b.remove());

  /* Rows: 3 rows — row0=inprogress, row1=scheduled-1, row2=scheduled-2 / diamonds */
  const rowTops = ['6px', '32px', '58px'];
  let rowIdx = 0;

  ITEMS.forEach(item => {
    const status = itemStatuses[item.id];
    let barType  = item.barType;
    /* After scheduling, update bar type */
    if (status === 'scheduled' && barType === 'diamond') barType = 'scheduled';

    if (barType === 'inprogress') {
      const el = document.createElement('div');
      el.className = 'tl-bar inprogress' + (selectedId === item.id ? ' selected' : '');
      el.style.left  = pct(item.barStart) + '%';
      el.style.width = Math.max(pct(item.barEnd - item.barStart), 4) + '%';
      el.style.top   = rowTops[0];
      el.style.position = 'absolute';
      /* Progress shine */
      el.innerHTML = `<div class="tl-bar-prog" style="width:${item.progress}%"></div><span style="position:relative;z-index:1;">${item.barLabel}</span>`;
      el.dataset.itemId = item.id;
      addBarEvents(el, item.id);
      barsArea.appendChild(el);
      rowIdx = 1;
    } else if (barType === 'scheduled') {
      const el = document.createElement('div');
      el.className = 'tl-bar scheduled' + (selectedId === item.id ? ' selected' : '');
      el.style.left  = pct(item.barStart) + '%';
      el.style.width = Math.max(pct((item.barEnd || (item.barStart + 0.3)) - item.barStart), 4) + '%';
      el.style.top   = rowTops[rowIdx] || rowTops[2];
      el.style.position = 'absolute';
      el.textContent = item.barLabel;
      el.dataset.itemId = item.id;
      addBarEvents(el, item.id);
      barsArea.appendChild(el);
      rowIdx = Math.min(rowIdx + 1, 2);
    } else if (barType === 'diamond') {
      const wrap = document.createElement('div');
      wrap.className = 'tl-diamond-wrap' + (selectedId === item.id ? ' selected' : '');
      wrap.style.left     = pct(item.barStart) + '%';
      wrap.style.top      = rowTops[rowIdx] || rowTops[2];
      wrap.style.position = 'absolute';
      wrap.style.height   = '22px';
      wrap.style.display  = 'flex';
      wrap.style.alignItems = 'center';
      wrap.dataset.itemId = item.id;
      wrap.innerHTML = `<div class="tl-diamond"></div><span class="tl-diamond-label">${item.barLabel}</span>`;
      addBarEvents(wrap, item.id);
      barsArea.appendChild(wrap);
      rowIdx = Math.min(rowIdx + 1, 2);
    }
  });
}

function addBarEvents(el, id) {
  const tooltip = document.getElementById('tlTooltip');
  const item    = ITEMS.find(i => i.id === id);

  el.addEventListener('click', () => {
    selectedId = id;
    renderTimeline();
    renderList();
    renderDetail();
  });

  el.addEventListener('mouseenter', (e) => {
    const st = itemStatuses[id];
    let msg = item.titleShort;
    if (st === 'inprogress') msg += ` · ${item.progress}% · ${item.eta}`;
    else if (st === 'scheduled') msg += ` · ${item.schedTime || schedTimes[id] || ''}`;
    else msg += ' · Needs action';
    tooltip.textContent = msg;
    tooltip.classList.add('visible');
    moveTooltip(e);
  });

  el.addEventListener('mousemove', moveTooltip);

  el.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
}

function moveTooltip(e) {
  const t = document.getElementById('tlTooltip');
  t.style.left = (e.clientX + 12) + 'px';
  t.style.top  = (e.clientY - 28) + 'px';
}

/* ═══════════════════════════════════════════════════════════════════════
   LIST RENDERING
═══════════════════════════════════════════════════════════════════════ */
function renderList() {
  const container = document.getElementById('listItems');
  container.innerHTML = '';

  ITEMS.forEach(item => {
    const status = itemStatuses[item.id];
    const isSelected = selectedId === item.id;

    const el = document.createElement('div');
    el.className = 'list-item' + (isSelected ? ' selected' : '');
    el.dataset.id = item.id;

    /* Status chip HTML */
    let chipHtml = '';
    if (status === 'inprogress') {
      chipHtml = `<span class="li-status-chip inprogress"><span class="spinner-mini"></span> In Progress</span>`;
    } else if (status === 'scheduled') {
      chipHtml = `<span class="li-status-chip scheduled">⏰ ${schedTimes[item.id] || item.schedTimeShort || 'Scheduled'}</span>`;
    } else {
      chipHtml = `<span class="li-status-chip needs-action">⚡ Needs Action</span>`;
    }

    /* Progress bar for in-progress */
    const progHtml = status === 'inprogress'
      ? `<div class="li-progress-mini"><div class="li-progress-fill" style="width:${item.progress}%"></div></div>`
      : '';

    el.innerHTML = `
      <div class="li-row1">
        <span class="li-cat ${item.cat}"><span class="li-cat-dot"></span>${item.catLabel}</span>
        ${chipHtml}
      </div>
      <div class="li-title">${item.titleShort}</div>
      ${progHtml}
      <div class="li-row3">
        <span class="li-tenants">${item.tenants}</span>
        <span class="li-updated">${item.updated}</span>
      </div>`;

    el.addEventListener('click', () => {
      selectedId = item.id;
      renderTimeline();
      renderList();
      renderDetail();
    });

    container.appendChild(el);
  });
}

═══════════════════════════════════════════════════════════════════════ */
function renderFooter(item, status, fState) {
  const footer = document.getElementById('detailFooter');
  footer.innerHTML = '';

  if (fState === 'inprogress') {
    footer.innerHTML = `
      <div class="df-inprogress">
        <div class="df-ip-top">
          <div class="df-ip-label">
            <span class="spinner-mini" style="border-color:var(--uuif-brand-green);border-top-color:transparent;"></span>
            Deployment In Progress — ${item.progress}%
          </div>
          <span class="df-ip-eta">${item.eta}</span>
        </div>
        <div class="df-prog-bar">
          <div class="df-prog-fill" style="width:${item.progress}%"></div>
        </div>
        <div class="df-ip-bottom">
          <span class="df-ip-status">Patching ${item.tenants} · No issues detected</span>
          <div class="df-ip-links">
            <button class="btn-view" onclick="showToast('Opening deployment log...')">View Log</button>
            <button class="btn-pause" onclick="showToast('Pause requested — SAMI will complete current device before pausing.')">Pause</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if (fState === 'scheduled') {
    const t = schedTimes[item.id] || item.schedTime || 'Scheduled';
    footer.innerHTML = `
      <div class="df-scheduled">
        <div class="df-sched-info">
          <span class="df-sched-icon">⏰</span>
          <div>
            <div class="df-sched-text">Scheduled for ${t}</div>
            <div class="df-sched-sub">SAMI will auto-deploy · ${item.tenants}</div>
          </div>
        </div>
        <div class="df-sched-links">
          <button class="btn-edit" onclick="setFooterState(${item.id},'scheduling')">Edit</button>
          <button class="btn-cancel-s" onclick="cancelSchedule(${item.id})">Cancel</button>
          <button class="btn-dnow" onclick="deployNow(${item.id})">Deploy Now</button>
        </div>
      </div>`;
    return;
  }

  if (fState === 'scheduling') {
    const currentTime = schedTimes[item.id] || 'Tonight 11pm';
    const times = ['Tonight 11pm', 'Tomorrow 2am', 'Monday 2am', 'Custom'];
    const timeBtns = times.map(t =>
      `<button class="sch-time-btn${t === currentTime ? ' active' : ''}" onclick="selectTime(${item.id}, this, '${t}')">${t}</button>`
    ).join('');
    const reasoning = SAMI_REASONS[currentTime] || SAMI_REASONS['Custom'];
    footer.innerHTML = `
      <div class="df-scheduling">
        <div class="sch-header">
          <span class="sch-header-icon">📅</span>

        <div class="sch-time-row">${timeBtns}</div>

          <span class="sr-tag">SAMI</span>
          <span id="schReasoningText">${reasoning}</span>

          <button class="btn-cancel" onclick="setFooterState(${item.id}, 'default')">Cancel</button>
          <button class="btn-confirm" onclick="confirmSchedule(${item.id})">Confirm Schedule</button>
        </div>
      </div>`;
    return;
  }

  /* Default footer */
  const primLabel = status === 'needs-action' ? 'Review &amp; Approve' : 'Deploy Now';
  footer.innerHTML = `
    <div class="df-default">
      <span class="df-link" onclick="showToast('Opening affected device list...')">View ${item.tenants}</span>

        <button class="btn-sched-later" onclick="setFooterState(${item.id}, 'scheduling')">

      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════════════════════ */
function setFooterState(id, state) {
  footerState[id] = state;
  if (selectedId === id) renderDetail();
}

function selectTime(id, btn, time) {
  schedTimes[id] = time;
  /* Update active button */
  btn.closest('.sch-time-row').querySelectorAll('.sch-time-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  /* Update reasoning */
  const r = SAMI_REASONS[time] || SAMI_REASONS['Custom'];
  const rEl = document.getElementById('schReasoningText');
  if (rEl) rEl.textContent = r;
}

function confirmSchedule(id) {
  const time = schedTimes[id] || 'Tonight 11pm';
  itemStatuses[id] = 'scheduled';
  footerState[id]  = 'scheduled';
  schedTimes[id]   = time;

  /* Update Gantt bar */
  const item = ITEMS.find(i => i.id === id);
  if (item.barType === 'diamond') {
    item.barType = 'scheduled';
    const hourMap = {
      'Tonight 11pm':  23,
      'Tomorrow 2am':  26,
      'Monday 2am':    50,
      'Custom':        36
    };
    item.barStart = hourMap[time] || 36;
    item.barEnd   = item.barStart + 0.3;
    item.barLabel = item.titleShort.split(' ').slice(0,2).join(' ');
  }

  renderTimeline();
  renderList();
  renderDetail();
  showToast(`Scheduled — ${item.titleShort} · ${time}`);
}

function cancelSchedule(id) {
  itemStatuses[id] = 'needs-action';
  footerState[id]  = 'default';
  schedTimes[id]   = null;
  const item = ITEMS.find(i => i.id === id);
  item.barType = 'diamond';
  renderTimeline();
  renderList();
  renderDetail();
  showToast('Schedule cancelled — item returned to queue.');
}

function deployNow(id) {
  itemStatuses[id] = 'inprogress';
  footerState[id]  = 'inprogress';
  const item = ITEMS.find(i => i.id === id);
  item.barType  = 'inprogress';
  item.barStart = NOW_HOUR;
  item.barEnd   = NOW_HOUR + 0.3;
  item.progress = item.progress || 0;
  renderTimeline();
  renderList();
  renderDetail();
  showToast(`Deploying now — ${item.titleShort}`);
}

function primaryAction(id) {
  const status = itemStatuses[id];
  if (status === 'needs-action') {
    showToast('Approval submitted — SAMI will deploy immediately.');
    itemStatuses[id] = 'inprogress';
    footerState[id]  = 'inprogress';
    const item = ITEMS.find(i => i.id === id);
    item.barType  = 'inprogress';
    item.barStart = NOW_HOUR;
    item.barEnd   = NOW_HOUR + 0.3;
    item.progress = 0;
    renderTimeline();
    renderList();
    renderDetail();
  } else {
    deployNow(id);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

renderTimeline();
renderList();
renderDetail();
